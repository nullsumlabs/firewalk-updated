name: Release

# Pushing a tag such as v5.0.1 builds the release files and publishes them as a
# GitHub Release. Build steps mirror ci.yml on purpose, so this workflow can be
# read and debugged on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build release files
    runs-on: ubuntu-24.04
    container: debian:13

    steps:
      # The official Debian image does not ship git, which checkout needs.
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake build-essential \
            debhelper libdumbnet-dev libnet1-dev libpcap-dev

      - name: Configure and build
        run: |
          autoreconf -fi
          ./configure
          make

      - name: Run distcheck
        run: make distcheck

      - name: Collect release files
        run: |
          mkdir -p artifacts
          make dist
          mv firewalk-*.tar.gz artifacts/
          make distclean
          dpkg-buildpackage -us -uc -b
          # Package names vary by distribution: Debian ships the debug symbols
          # as firewalk-dbgsym_*.deb while Ubuntu uses *.ddeb. Collect whatever
          # dpkg-buildpackage actually produced instead of hard-coding one set.
          find .. -maxdepth 1 -type f \
            \( -name 'firewalk_*.deb' -o -name 'firewalk-*.deb' -o -name '*.ddeb' \
               -o -name 'firewalk_*.buildinfo' -o -name 'firewalk_*.changes' \) \
            -print -exec mv {} artifacts/ \;
          cd artifacts
          ls -l
          sha256sum -- * > SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: firewalk-release
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: firewalk-release
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Firewalk $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
